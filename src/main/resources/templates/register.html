<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Registro - Fundación ALMORA</title>

    <link rel="stylesheet" href="/css/auth.css" />
    <link rel="stylesheet" href="/css/base.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <div class="logo">ALMORA</div>
    </header>

    <main class="register-page">
      <section class="formulario">
        <h2>Registro de Usuario</h2>
        <p>
          Regístrate para apoyar nuestras causas como <strong>donante</strong>.
        </p>

        <form id="registroForm">
          <div class="campo">
            <label for="nombre">Nombre completo:</label>
            <input type="text" id="nombre" name="nombre" required />
          </div>

          <div class="campo">
            <label for="correo">Correo electrónico:</label>
            <input type="email" id="correo" name="correo" required />
          </div>

          <div class="campo">
            <label for="password">Contraseña:</label>
            <input
              type="password"
              id="password"
              name="password"
              minlength="5"
              placeholder="Mínimo 5 caracteres"
              required
            />
            <span class="input-hint"
              >La contraseña debe tener al menos 5 caracteres.</span
            >
          </div>

          <div class="campo">
            <label for="telefono">Teléfono (Opcional):</label>
            <input
              type="tel"
              id="telefono"
              name="telefono"
              pattern="[0-9]{10}"
              maxlength="10"
              placeholder="Ej: 3001234567"
            />
            <span class="input-hint"
              >Ingrese un número de teléfono válido .</span
            >
          </div>

          <button type="submit" class="btn-registrar">Registrarme</button>
        </form>
      </section>
    </main>

    <footer class="footer">
      <p>© 2025 Fundación ALMORA — Todos los derechos reservados</p>
    </footer>

    <script>
      const API_URL = "/api/usuarios";

      document
        .getElementById("registroForm")
        .addEventListener("submit", async (event) => {
          event.preventDefault();

          // Obtener datos del formulario
          const nombre = document.getElementById("nombre").value.trim();
          const correo = document.getElementById("correo").value.trim();
          const password = document.getElementById("password").value.trim();
          const telefono =
            document.getElementById("telefono").value.trim() ||
            "No proporcionado";

          if (!nombre || !correo || !password) {
            alert(
              "⚠️ Todos los campos obligatorios excepto teléfono deben ser completados.",
            );
            return;
          }

          // Crear objeto para enviar al backend
          const nuevoDonante = {
            nombre: nombre,
            correo: correo,
            password: password,
            telefono: telefono,
          };

          try {
            const response = await fetch(API_URL, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(nuevoDonante),
            });

            if (!response.ok) {
              const errorData = await response.json().catch(() => ({}));
              const errorMsg =
                errorData.message ||
                "Error al registrar el usuario en el servidor";
              throw new Error(errorMsg);
            }

            const data = await response.json();
            console.log("Donante registrado:", data);

            alert(`✅ Registro exitoso. ¡Gracias por unirte, ${nombre}!`);

            setTimeout(() => {
              window.location.href = "/login.html";
            }, 1000);

            event.target.reset();
          } catch (error) {
            console.error("Error en el registro:", error);
            alert(`❌ Ocurrió un error: ${error.message}`);
          }
        });
    </script>
  </body>
</html>
